# Docker Compose for Stirling Chat MVP
# This sets up PostgreSQL with pgvector extension for local development

version: '3.8'

services:
  # PostgreSQL database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stirling_chat_db
    environment:
      # Database credentials (change password in production)
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: stirling_dev_2024
      POSTGRES_DB: stirling_chat
    ports:
      # Map container port 5432 to host port 5432
      - "5432:5432"
    volumes:
      # Persist database data
      - postgres_data:/var/lib/postgresql/data
      # Initialize pgvector extension on startup
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
