## 🔧 Phase 1: Backend Deployment Preparation

### ✅ Step 1: Create Backend Dockerfile
**Why?** Railway needs instructions on how to build your Python app.

**What it does:**
- Starts with Python base image
- Installs dependencies (gcc, postgresql-client, curl)
- Copies your code
- Runs the FastAPI server on port 8000

**Key Features:**
- **Security**: Runs as non-root user
- **Health Check**: Railway monitors app health
- **Optimization**: Caches dependencies for faster builds

### ✅ Step 2: Health Check Endpoint
**Status**: Already exists! ✅

You have `/health` endpoint in `main.py:153` - perfect for Railway monitoring.

### Step 3: Create Railway Configuration File

**Why?** Tells Railway how to deploy your service.

**What it does:** Defines service settings, environment variables, and deployment options.

Let's create the railway.toml file:
<tool_call>write_to_file
<arg_key>CodeContent</arg_key>
<arg_value># Railway.app Configuration
[deploy]
# Health check endpoint for Railway to monitor
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[build]
# Build from backend directory
builder = "nixpacks"

[[services]]
# Backend FastAPI service
name = "stirling-chat-backend"
source = "."
[services.config]
# Environment variables (will be set in Railway dashboard)
[services.config.variables]
# These will be set in Railway UI:
# DATABASE_URL
# OPENAI_API_KEY  
# ANTHROPIC_API_KEY
# FIRECRAWL_API_KEY
